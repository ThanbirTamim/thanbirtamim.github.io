<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141b2e" />
  <meta name="description" content="Chess — play private-room multiplayer Chess with a friend (P2P/WebRTC) or vs the computer (4 AI levels). Full rules, clocks, offline pass & play. Runs entirely in the browser." />
  <title>♟ Chess — Play with Friends</title>
  <link rel="icon" href="../../assets/img/favicon2.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap" id="wrap">

    <!-- ===================== MAIN MENU ===================== -->
    <section class="screen active" id="menuScreen">
      <div class="panel">
        <div class="logo">♟</div>
        <h1 class="title">CHESS</h1>
        <p class="subtitle">Play with friends</p>
        <div class="btns">
          <button class="btn primary" id="createBtn">➕ Create Room</button>
          <button class="btn" id="joinBtn">🔑 Join Room</button>
          <div class="divider"><span>play offline</span></div>
          <button class="btn" id="cpuBtn">🤖 Play vs Computer</button>
          <button class="btn ghost" id="passplayBtn">👥 Pass &amp; Play</button>
        </div>
        <div class="menu-foot">
          <button class="mini" id="soundBtn">🔊 Sound</button>
          <button class="mini" id="helpBtn">❓ How to play</button>
        </div>
      </div>
    </section>

    <!-- ===================== CREATE ROOM ===================== -->
    <section class="screen" id="createScreen">
      <div class="panel">
        <h2 class="title small">Create Room</h2>
        <label class="fld"><span>Your name</span><input id="createName" maxlength="14" placeholder="Thanbir" /></label>
        <label class="fld"><span>Play as</span>
          <div class="seg" id="createColor"><button data-c="w" class="on">♔ White</button><button data-c="b">♚ Black</button><button data-c="r">🎲 Random</button></div>
        </label>
        <label class="fld"><span>Time control</span>
          <div class="seg wrap-seg" id="createTime"><button data-t="off" class="on">None</button><button data-t="3+2">3+2</button><button data-t="5+0">5+0</button><button data-t="10+0">10+0</button><button data-t="15+10">15+10</button></div>
        </label>
        <label class="fld"><span>Passcode (optional)</span><input id="createPass" maxlength="4" inputmode="numeric" placeholder="4-digit, optional" /></label>
        <div class="btns"><button class="btn primary" id="doCreate">Create Room</button><button class="btn ghost" data-back>← Back</button></div>
        <p class="hint" id="createHint"></p>
      </div>
    </section>

    <!-- ===================== JOIN ROOM ===================== -->
    <section class="screen" id="joinScreen">
      <div class="panel">
        <h2 class="title small">Join Room</h2>
        <label class="fld"><span>Room code</span><input id="joinCode" maxlength="6" placeholder="C7K92P" style="text-transform:uppercase" /></label>
        <label class="fld"><span>Your name</span><input id="joinName" maxlength="14" placeholder="Player 2" /></label>
        <label class="fld"><span>Passcode (if required)</span><input id="joinPass" maxlength="4" inputmode="numeric" placeholder="4-digit" /></label>
        <div class="btns"><button class="btn primary" id="doJoin">Join Room</button><button class="btn ghost" data-back>← Back</button></div>
        <p class="hint" id="joinHint"></p>
      </div>
    </section>

    <!-- ===================== VS COMPUTER ===================== -->
    <section class="screen" id="cpuScreen">
      <div class="panel">
        <h2 class="title small">Play vs Computer</h2>
        <label class="fld"><span>Your name</span><input id="cpuName" maxlength="14" placeholder="You" /></label>
        <label class="fld"><span>Play as</span>
          <div class="seg" id="cpuColor"><button data-c="w" class="on">♔ White</button><button data-c="b">♚ Black</button><button data-c="r">🎲 Random</button></div>
        </label>
        <label class="fld"><span>AI difficulty</span>
          <div class="seg" id="cpuDiff"><button data-d="easy">Easy</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Hard</button><button data-d="expert">Expert</button></div>
        </label>
        <label class="fld"><span>Time control</span>
          <div class="seg wrap-seg" id="cpuTime"><button data-t="off" class="on">None</button><button data-t="5+0">5+0</button><button data-t="10+0">10+0</button><button data-t="15+10">15+10</button></div>
        </label>
        <div class="btns"><button class="btn primary" id="doCpu">Start</button><button class="btn ghost" data-back>← Back</button></div>
      </div>
    </section>

    <!-- ===================== LOBBY ===================== -->
    <section class="screen" id="lobbyScreen">
      <div class="panel">
        <h2 class="title small">Room <span class="code" id="lobbyCode">------</span></h2>
        <button class="mini copy" id="copyCode">📋 Copy code</button>
        <div class="roster" id="lobbyRoster"></div>
        <p class="hint" id="lobbyStatus">Waiting for opponent…</p>
        <div class="btns">
          <button class="btn primary" id="startGameBtn">▶ Start Game</button>
          <button class="btn ghost" id="leaveLobbyBtn">Leave</button>
        </div>
      </div>
    </section>

    <!-- ===================== GAME ===================== -->
    <section class="screen" id="gameScreen">
      <div class="topbar">
        <button class="mini" id="gameMenuBtn">☰</button>
        <span class="gb-title">♟ Chess</span>
        <span class="gb-room" id="gbRoom"></span>
        <span class="gb-turn" id="gbTurn"></span>
      </div>

      <!-- opponent (top) info: name, captured pieces, clock -->
      <div class="pbar" id="topBar">
        <span class="pb-name" id="topName">Opponent</span>
        <span class="pb-captures" id="topCaptures"></span>
        <span class="pb-clock" id="topClock"></span>
      </div>

      <div class="boardwrap">
        <canvas id="board"></canvas>
        <div class="turn-banner" id="turnBanner"></div>
        <div class="net-overlay hidden" id="netOverlay"></div>
        <!-- promotion picker -->
        <div class="promo hidden" id="promo"></div>
      </div>

      <!-- me (bottom) info -->
      <div class="pbar" id="botBar">
        <span class="pb-name" id="botName">You</span>
        <span class="pb-captures" id="botCaptures"></span>
        <span class="pb-clock" id="botClock"></span>
      </div>

      <!-- move list -->
      <div class="movelist" id="moveList"></div>

      <div class="controls">
        <button class="mini" id="flipBtn">🔄 Flip</button>
        <button class="mini" id="drawBtn">½ Offer draw</button>
        <button class="mini danger" id="resignBtn">🏳 Resign</button>
        <span class="ctrl-hint" id="ctrlHint">Your move</span>
      </div>

      <!-- Quick reactions (emoji + preset phrases + chat) -->
      <div class="emote-dock">
        <div class="emote-tray hidden" id="emoteTray"></div>
        <button class="emote-fab" id="emoteBtn" title="Send a reaction" aria-label="Send a reaction">😊</button>
      </div>
    </section>

    <!-- ===================== RESULTS ===================== -->
    <section class="screen" id="resultsScreen">
      <div class="panel">
        <div class="logo" id="resultIcon">🏆</div>
        <h2 class="title small" id="resultTitle">Results</h2>
        <p class="hint" id="resultReason"></p>
        <div class="matchstats" id="matchStats"></div>
        <div class="btns">
          <button class="btn primary" id="playAgainBtn">↻ Play Again</button>
          <button class="btn" id="toLobbyBtn">Return to Lobby</button>
          <button class="btn ghost" id="toMenuBtn">Main Menu</button>
        </div>
      </div>
    </section>

    <!-- ===================== MODAL ===================== -->
    <div class="overlay hidden" id="modal"><div class="panel" id="modalContent"></div></div>

    <a class="back-home" href="../index.html" title="Back to games">← Games</a>
  </div>

  <!-- PeerJS (WebRTC signalling broker; P2P data). Only needed for online rooms. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js"></script>
  <script src="chess.js"></script>
  <script src="ai.js"></script>
  <script src="network.js"></script>
  <script src="game.js"></script>
</body>
</html>
